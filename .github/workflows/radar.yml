name: radar

on:
  schedule:
    # Off the :00 mark, the busiest and most delayed slot on GitHub.
    - cron: "7,37 * * * *"   # poll every 30 min
    - cron: "15 1,12 * * *"  # digest at 08:15 and 19:15 GMT+7
  workflow_dispatch:
    inputs:
      mode:
        description: poll, digest, selftest (checks Claude only), or job (alert for one Freelancer link)
        type: choice
        options: [poll, digest, selftest, job]
        default: poll
      job:
        description: Freelancer project link or id (mode job only)
        type: string
        required: false

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # only for re-enabling this workflow (keepalive)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '15 1,12 * * *' && 'digest' || 'poll') }}
    steps:
      # No token left in .git/config while dependencies and the bot run;
      # the token is used only in the push at the end.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out state branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          git ls-remote --exit-code --heads origin state > /dev/null
          code=$?
          set -e
          if [ "$code" = 0 ]; then
            git fetch --depth 1 origin state
            git worktree add -B state state FETCH_HEAD
          elif [ "$code" = 2 ]; then
            git worktree add --orphan -b state state
          else
            echo "could not reach origin (exit $code)"; exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # Official package, pinned. Its postinstall puts the native binary in place,
      # so scripts must run here (they stay off for npm ci above).
      - name: Install Claude Code
        run: |
          npm i -g @anthropic-ai/claude-code@2.1.325
          claude --version

      - name: Run ${{ env.MODE }}
        run: npm run "$MODE"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # Passed as data, never pasted into the script.
          JOB: ${{ inputs.job }}

      - name: Save state
        if: always()
        working-directory: state
        env:
          TOKEN: ${{ github.token }}
        run: |
          [ -f state.json ] || exit 0
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "state: $MODE $(date -u +%Y-%m-%dT%H:%MZ)"
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$remote" state || (sleep 5 && git push "$remote" state)

      # GitHub disables schedules in public repos after 60 days without
      # activity; re-enabling on each digest keeps the radar alive.
      - name: Keep schedule enabled
        if: env.MODE == 'digest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/radar.yml/enable" || true
