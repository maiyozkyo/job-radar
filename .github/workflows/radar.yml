name: radar

on:
  schedule:
    - cron: "*/30 * * * *"   # poll
    - cron: "0 1,12 * * *"   # digest at 08:00 and 19:00 GMT+7
  workflow_dispatch:
    inputs:
      mode:
        description: poll or digest
        type: choice
        options: [poll, digest]
        default: poll

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '0 1,12 * * *' && 'digest' || 'poll') }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out state branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin state > /dev/null; then
            git fetch --depth 1 origin state
            git worktree add -B state state FETCH_HEAD
          else
            git worktree add --orphan -b state state
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code

      - name: Run ${{ env.MODE }}
        run: npm run "$MODE"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Save state
        if: always()
        working-directory: state
        run: |
          [ -f state.json ] || exit 0
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "state: $MODE $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin state
